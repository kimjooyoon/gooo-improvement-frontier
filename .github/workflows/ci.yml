name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Run CI-first conformance
        env:
          GH_TOKEN: ${{ github.token }}
          CI_OUTPUT_ROOT: ${{ runner.temp }}/gooo-improvement-frontier-${{ github.run_id }}
        run: bash scripts/ci-conformance.sh
      - name: Preserve CI attempts and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gooo-improvement-frontier-ci-${{ github.run_id }}
          path: ${{ runner.temp }}/gooo-improvement-frontier-${{ github.run_id }}
          if-no-files-found: error

